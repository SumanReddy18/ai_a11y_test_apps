name: All-Rules Build & Release (1 APK + 1 IPA)

# Dedicated flow for the standalone all-rules fixture under allrules/ — completely
# separate from release.yml (the per-flavor apps). Produces exactly two artifacts:
#   ai-app-a11y-allrules-v<version>.apk  and  ai-app-a11y-allrules-v<version>.ipa
# published as GitHub Release "allrules-v<version>" (own tag namespace, so it never
# collides with the existing v<version> releases).
#
# Triggers only when allrules/** (or this file) changes; release.yml ignores those
# paths, so neither flow ever fires for the other's commits.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 1.1.0). Leave blank to auto-bump the patch."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "allrules/**"
      - ".github/workflows/allrules-release.yml"

permissions:
  contents: write

concurrency:
  group: allrules-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- compute version
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      code: ${{ steps.calc.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute next version
        id: calc
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          GRADLE=allrules/android/app/build.gradle
          CUR_VER=$(grep -oE '\?:[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"' "$GRADLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CUR_CODE=$(grep -oE "appVersionCode'\)\?\.toInteger\(\) \?: [0-9]+" "$GRADLE" | grep -oE '[0-9]+$' | head -1)
          if [ -n "${INPUT_VERSION}" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version '$INPUT_VERSION'"; exit 1
            fi
            NEW_VER="$INPUT_VERSION"
          else
            IFS=. read -r MA MI PA <<< "$CUR_VER"
            NEW_VER="$MA.$MI.$((PA + 1))"
          fi
          NEW_CODE=$((CUR_CODE + 1))
          echo "current: $CUR_VER ($CUR_CODE) -> new: $NEW_VER ($NEW_CODE)"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "code=$NEW_CODE"   >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- Android APK
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Build APK
        working-directory: allrules/android
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$CODE"
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/*.apk ../../out/
          ls -lh ../../out
      - uses: actions/upload-artifact@v7
        with:
          name: allrules-apk
          path: out/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS IPA
  ios:
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: allrules/ios
        run: xcodegen generate
      - name: Build unsigned .ipa
        working-directory: allrules/ios
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          set -euo pipefail
          xcodebuild build -project A11yAllRules.xcodeproj -scheme A11yAllRules \
            -configuration Release -sdk iphoneos -derivedDataPath dd \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$CODE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          APP=$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "No .app produced"; exit 1; }
          mkdir -p Payload && cp -R "$APP" Payload/
          mkdir -p ../../out
          zip -qry "../../out/ai-app-a11y-allrules-v${VERSION}.ipa" Payload
          ls -lh ../../out
      - uses: actions/upload-artifact@v7
        with:
          name: allrules-ipa
          path: out/*.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------- publish + bump
  release:
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: allrules-apk
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: allrules-ipa
          path: dist
      - name: Bump version in source & commit with [skip ci]
        # Only on the auto path (plain push); an explicit-version manual run is a fixed
        # re-release and must not rewrite source.
        if: ${{ github.event.inputs.version == '' }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          set -euo pipefail
          sed -i -E "s/(appVersionCode'\)\?\.toInteger\(\) \?: )[0-9]+/\1${CODE}/" allrules/android/app/build.gradle
          sed -i -E "s/(appVersionName'\) \?: \")[0-9]+\.[0-9]+\.[0-9]+/\1${VERSION}/" allrules/android/app/build.gradle
          sed -i -E "s/(MARKETING_VERSION: )\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"${VERSION}\"/" allrules/ios/project.yml
          sed -i -E "s/(CURRENT_PROJECT_VERSION: )\"[0-9]+\"/\1\"${CODE}\"/" allrules/ios/project.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allrules/android/app/build.gradle allrules/ios/project.yml
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore: allrules release v${VERSION} (build ${CODE}) [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release delete "allrules-v${VERSION}" --yes 2>/dev/null || true
          gh release create "allrules-v${VERSION}" dist/*.apk dist/*.ipa \
            --title "allrules-v${VERSION}" \
            --notes "All-rules fixture: 1 APK + 1 IPA covering all 40 App Accessibility rules across 3 auto-advancing pages. iOS build is unsigned (BrowserStack re-signs on upload)."
